<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060B" />

    <!-- ====================================================================
         SEO — these values mirror siteConfig.seo. Update both when rebranding.
         Base tags live here so crawlers that don't execute JS still get them;
         src/hooks/useDocumentMeta.ts keeps them in sync during navigation.
         ==================================================================== -->
    <title>AHM Systems | Engineering Digital Solutions</title>
    <meta
      name="description"
      content="AHM Systems builds modern websites, mobile applications, and custom software solutions that help businesses grow through technology."
    />
    <meta
      name="keywords"
      content="software development company, custom software solutions, web development agency, mobile app development, lead intelligence, CRM development, business automation, AI business solutions"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ahmsystem.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AHM Systems" />
    <meta property="og:title" content="AHM Systems | Engineering Digital Solutions" />
    <meta
      property="og:description"
      content="AHM Systems builds modern websites, mobile applications, and custom software solutions that help businesses grow through technology."
    />
    <meta property="og:url" content="https://ahmsystem.com/" />
    <meta property="og:image" content="https://ahmsystem.com/og-image.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ahmsystems" />
    <meta name="twitter:title" content="AHM Systems | Engineering Digital Solutions" />
    <meta
      name="twitter:description"
      content="AHM Systems builds modern websites, mobile applications, and custom software solutions that help businesses grow through technology."
    />
    <meta name="twitter:image" content="https://ahmsystem.com/og-image.svg" />

    <!-- Brand icons, generated from the AHM mark — see /public -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: describes the business for search engines. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AHM Systems",
        "description": "AHM Systems is a software and technology company building modern digital experiences, scalable software and innovative technology solutions that help businesses grow.",
        "url": "https://ahmsystem.com/",
        "email": "ahmsystemm@gmail.com",
        "telephone": "+92 311 5732602",
        "areaServed": "Worldwide",
        "slogan": "Engineering Digital Solutions",
        "logo": "https://ahmsystem.com/favicon.svg",
        "founder": [
          { "@type": "Person", "name": "Ahmed" },
          { "@type": "Person", "name": "Hasnat" },
          { "@type": "Person", "name": "Muzammil" }
        ],
        "knowsAbout": [
          "Software development",
          "Web development",
          "Mobile application development",
          "CRM development",
          "Business automation",
          "Mobile application development",
          "UI/UX design"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Capabilities",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile App Development" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Web Development" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Automation" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Solutions" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "CRM & Sales Systems" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "UI/UX Design" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #e9ecf5">
        <h1>AHM Systems</h1>
        <p>
          This site needs JavaScript enabled. To get in touch directly, email
          <a href="mailto:ahmsystemm@gmail.com" style="color: #4c7dff">ahmsystemm@gmail.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
